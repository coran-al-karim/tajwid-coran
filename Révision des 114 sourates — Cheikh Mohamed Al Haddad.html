.app{max-width:640px;margin:0 auto;padding:20px 16px 140px;}
h1,p.sub{background:var(--card);border-radius:8px;padding:6px 10px;display:inline-block;}

h1{font-size:1.3rem;margin:4px 0 2px;}
p.sub{color:var(--sub);margin:0 0 16px;font-size:.9rem;}
input#search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:1rem;margin-bottom:14px;}
ul#list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
li.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  background:var(--card);border:1px solid var(--border);cursor:pointer;}
li.item.playing{background:var(--active);border-color:var(--accent);}
.num{width:26px;height:26px;border-radius:50%;background:var(--border);color:var(--sub);
  font-size:.75rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.item.playing .num{background:var(--accent);color:#fff;}
.names{flex:1;min-width:0;}
.tr{font-weight:600;font-size:.95rem;}
.fr{color:var(--sub);font-size:.8rem;}
.ar{flex-shrink:0;text-align:right;font-size:1.15rem;font-weight:700;color:var(--accent);
  direction:rtl;font-family:"Traditional Arabic","Scheherazade New","Amiri",serif;}

.np-screen.active{display:flex;}
.np-top-area{flex:0 0 auto;background:transparent;position:relative;
  padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:30px;
  display:flex;justify-content:center;}
.np-back{position:absolute;left:16px;top:calc(16px + env(safe-area-inset-top,0px));
  background:rgba(20,20,15,.35);border:none;border-radius:50%;width:34px;height:34px;
  font-size:1.2rem;color:#fff;cursor:pointer;}
.np-badge{width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.85);
  border:3px double #caa24a;display:flex;align-items:center;justify-content:center;
  font-size:3rem;margin-top:26px;box-shadow:0 4px 18px rgba(0,0,0,.25);}
.np-skyline{display:none;}
.np-bottom{flex:1;color:#2f2b22;padding:14px 20px calc(20px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;overflow:hidden;
  background:linear-gradient(to bottom, rgba(250,247,240,0) 0%, rgba(250,247,240,.55) 18%, rgba(248,243,233,.88) 40%, rgba(246,241,229,.96) 100%);}
.np-info{width:100%;display:flex;flex-direction:column;align-items:center;}
.np-playback{width:100%;display:flex;flex-direction:column;align-items:center;margin-top:26px;}
.np-icons{width:100%;display:flex;justify-content:space-between;align-items:center;}
.np-heart{background:none;border:1px solid #2f5c46;color:#2f5c46;border-radius:50%;
  width:38px;height:38px;font-size:1.1rem;cursor:pointer;}
.np-heart.liked{color:#e07a7a;border-color:#e07a7a;}
.np-num{font-size:.8rem;color:#7a7565;}
.np-title{direction:rtl;font-family:"Traditional Arabic","Scheherazade New","Amiri",serif;
  font-size:2rem;margin:14px 0 2px;text-align:center;color:#233c2f;}
.np-sub{color:#7a7565;font-size:.85rem;margin-bottom:6px;}
.np-message{color:#e8b04b;font-size:.85rem;text-align:center;margin-bottom:16px;}
.np-waveform{position:relative;width:100%;height:44px;margin-bottom:6px;cursor:pointer;}
.wave-bg,.wave-fg{position:absolute;top:0;left:0;height:100%;width:100%;
  display:flex;align-items:flex-end;gap:2px;overflow:hidden;}
.wave-bg span{background:#c9c0ac;}
.wave-fg{width:0%;}
.wave-fg span{background:#c9902e;}
.wave-bg span,.wave-fg span{flex:1;min-width:2px;border-radius:2px;}
.wave-handle{position:absolute;top:50%;left:0%;width:12px;height:12px;border-radius:50%;
  background:#c9902e;box-shadow:0 0 0 4px rgba(201,144,46,.25);transform:translate(-50%,-50%);
  pointer-events:none;}
.np-times{width:100%;display:flex;justify-content:space-between;font-size:.75rem;
  color:#7a7565;margin-bottom:16px;}
.np-controls{display:flex;align-items:center;justify-content:center;gap:20px;}
.np-mini{background:#4f6fea;border:none;color:#fff;font-size:1rem;cursor:pointer;
  width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.np-mini svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;}
.np-mini.active{background:transparent;border:1px solid rgba(255,255,255,.35);color:rgba(255,255,255,.5);}
.np-toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);
  background:#1f3d2f;color:#f2ede4;padding:10px 18px;border-radius:20px;font-size:.85rem;
  opacity:0;transition:opacity .2s, transform .2s;z-index:2000;pointer-events:none;}
.np-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.np-play{background:#2f5c46;color:#f2ede4;border:none;border-radius:50%;
  width:62px;height:62px;font-size:1.4rem;cursor:pointer;}
</style>
</head>

  <h1 dir="rtl" lang="ar" style="font-family:'Traditional Arabic','Scheherazade New','Amiri',serif;font-size:1.4rem;line-height:1.8;">السلام عليكم ورحمة الله وبركاته</h1>
  <p class="sub" dir="rtl" lang="ar" style="font-family:'Traditional Arabic','Scheherazade New','Amiri',serif;font-size:1.05rem;line-height:1.9;">مرحبًا بكم في تلاوة القرآن الكريم بصوت القارئ محمد الحداد، برواية حفص عن عاصم وبتجويد متقن</p>

  <ul id="list"></ul>
</div>

[110,"An-Nasr","Le Secours","النصر"],[111,"Al-Masad","Les Fibres","المسد"],[112,"Al-Ikhlas","Le Monothéisme pur","الإخلاص"],
[113,"Al-Falaq","L'Aube naissante","الفلق"],[114,"An-Nas","Les Hommes","الناس"]
];

// ⚠️ AJOUTE ICI LES LIENS DE TES FICHIERS AUDIO (voir explications données par Claude)
// Exemple : audioUrls[2] = "https://tonsite.com/audios/002-al-baqara.mp3";
const audioUrls = {
  1: "" // remplace par le lien réel de ta sourate Al-Fatiha, etc.
};

const listEl = document.getElementById('list');
const audio = document.getElementById('audio');
let currentIndex = -1;

function render(filter=""){
  listEl.innerHTML = "";
  sourates.forEach((s, i) => {
    const [num, tr, fr, ar] = s;
    if(filter && !(tr.toLowerCase().includes(filter) || fr.toLowerCase().includes(filter) || String(num)===filter)) return;
    const li = document.createElement('li');
    li.className = 'item' + (i===currentIndex ? ' playing' : '');
    li.innerHTML = `<div class="num">${num}</div><div class="names"><div class="tr">${tr}</div><div class="fr">${fr}</div></div><div class="ar">${ar}</div>`;
    li.onclick = () => openTrack(i);
    listEl.appendChild(li);
  });
}

// --- Écran plein écran (façon appli Coran) ---
const npScreen = document.getElementById('npScreen');
const npTitle = document.getElementById('npTitle');
const npSub = document.getElementById('npSub');
const npNum = document.getElementById('npNum');
const npPlay = document.getElementById('npPlay');
const npCurrent = document.getElementById('npCurrent');
const npDuration = document.getElementById('npDuration');
const waveBg = document.getElementById('waveBg');
const waveFg = document.getElementById('waveFg');
const waveHandle = document.getElementById('waveHandle');
const npHeart = document.getElementById('npHeart');
const npShare = document.getElementById('npShare');
const npRepeat = document.getElementById('npRepeat');
const npMessage = document.getElementById('npMessage');
const npWaveEl = document.getElementById('npWave');

function fmt(sec){
  if(!isFinite(sec)) return "00:00";
  const m = Math.floor(sec/60), s = Math.floor(sec%60);
  return String(m).padStart(2,'0') + ":" + String(s).padStart(2,'0');
}

function buildWave(){
  waveBg.innerHTML = ""; waveFg.innerHTML = ""; waveFg.style.width = "0%";
  for(let i=0;i<48;i++){
    const h = 20 + Math.round(Math.random()*80);
    const b1 = document.createElement('span'); b1.style.height = h+"%";
    const b2 = document.createElement('span'); b2.style.height = h+"%";
    waveBg.appendChild(b1); waveFg.appendChild(b2);
  }
}

function openTrack(index){
  const [num, tr, fr, ar] = sourates[index];
  const url = audioUrls[num];
  currentIndex = index;
  npTitle.textContent = ar;
  npSub.textContent = tr + " — " + fr;
  npNum.textContent = "Sourate " + num + "/114";
  npScreen.classList.add('active');
  render(document.getElementById('search').value.trim().toLowerCase());

  if(!url){
    audio.pause(); audio.removeAttribute('src');
    npMessage.style.display = 'block';
    npWaveEl.style.display = 'none';
    npCurrent.textContent = "00:00"; npDuration.textContent = "00:00";
    npPlay.textContent = "▶";
    return;
  }
  npMessage.style.display = 'none';
  npWaveEl.style.display = 'block';
  if(audio.src !== url){
    audio.src = url;
    buildWave();
    audio.play().catch(()=>{});
  } else if(audio.paused){
    audio.play();
  }
}

document.getElementById('npBack').onclick = () => npScreen.classList.remove('active');

npPlay.onclick = () => {
  if(!audio.src || npMessage.style.display==='block') return;
  if(audio.paused) audio.play(); else audio.pause();
};
document.getElementById('npNext').onclick = () => goNext();
document.getElementById('npPrev').onclick = () => {
  if(currentIndex > 0) openTrack(currentIndex-1);
};
function goNext(){
  if(sourates.length < 2) return;
  if(currentIndex < sourates.length-1){
    openTrack(currentIndex+1);
  }
}
npShare.onclick = () => {
  const data = { title: npTitle.textContent + " — " + npSub.textContent, url: location.href };
  if(navigator.share){
    navigator.share(data).catch(()=>{});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(location.href).then(showToast).catch(()=>{});
  }
};
function showToast(){
  let t = document.getElementById('npToast');
  if(!t){
    t = document.createElement('div');
    t.id = 'npToast'; t.className = 'np-toast';
    document.body.appendChild(t);
  }
  t.textContent = "Lien copié";
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}
npRepeat.onclick = () => { audio.loop = !audio.loop; npRepeat.classList.toggle('active', audio.loop); };
npHeart.onclick = () => npHeart.classList.toggle('liked') ? (npHeart.textContent="♥") : (npHeart.textContent="♡");

audio.onended = () => { if(!audio.loop) goNext(); };
audio.onplay = () => { npPlay.textContent = "⏸"; render(document.getElementById('search').value.trim().toLowerCase()); };
audio.onpause = () => { npPlay.textContent = "▶"; };
audio.onloadedmetadata = () => { npDuration.textContent = fmt(audio.duration); };
audio.ontimeupdate = () => {
  npCurrent.textContent = fmt(audio.currentTime);
  if(audio.duration){
    const pct = (audio.currentTime/audio.duration*100);
    waveFg.style.width = pct + "%";
    waveHandle.style.left = pct + "%";
  }
};
document.getElementById('npWave').onclick = (e) => {
  if(!audio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX-rect.left)/rect.width) * audio.duration;
};

document.getElementById('search').addEventListener('input', e => render(e.target.value.trim().toLowerCase()));

render();
</script>
